[pytest]
# 경고를 기본적으로 오류로 취급한다. -W error 를 매번 붙이는 것을 잊으면
# 게이트가 조용히 사라지므로 설정에 박아둔다.
filterwarnings =
    error
    # starlette 0.41.3 의 testclient 가 anyio 4.x 에서 폐기된
    # anyio.abc.BlockingPortal 별칭을 임포트한다. 우리 코드와 무관한 버전 스큐다.
    # starlette 가 anyio.from_thread.BlockingPortal 로 옮겨간 버전으로 올리면 이 줄을 지운다.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
